[project]
name = "catalog-steward"
version = "0.1.0"
description = "Evidence-grounded data-catalog hygiene steward and evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.9,<2",
    "duckdb>=1.3,<2",
    "jsonschema>=4.23,<5",
    "openai>=1.50,<3",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "sqlglot>=26,<30",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_steward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' -q"
markers = [
    "live: makes paid model calls or reaches an external service; run explicitly",
]

